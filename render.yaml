# Render Blueprint: a free test deploy of the app (see "Hosting" in the README).
# The database is on Neon, since Render's free Postgres is deleted after 30 days.
services:
  - type: web
    name: mikeronn
    runtime: docker
    plan: free
    region: frankfurt
    # Where the website and the server are worked on: every push to it deploys.
    branch: web-application
    # Checked before a new version takes over; it also checks the database.
    healthCheckPath: /healthz
    envVars:
      # Asked for when the Blueprint is first applied: Neon's connection string
      # and the Finnhub and Twelve Data keys from your .env.
      - key: DATABASE_URL
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      # Render's proxy is the only way in. It says who the visitor is and that
      # they came over HTTPS, which the app only believes with this set.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Who the visitor is, though, is not taken from X-Forwarded-For: Render
      # only adds to what the visitor sent there. Cloudflare, in front of
      # Render, gives the address in a header it lets nobody else send.
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
      # Codes are emailed through Brevo's free plan. Render's free plan blocks
      # the usual mail ports (25, 465 and 587), but not 2525.
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      # Typed into the dashboard rather than kept in this public file: Brevo's
      # SMTP login and key, the sender Brevo has checked, and the addresses
      # that may sign up. Applying this file leaves them alone.
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: INVITED_EMAILS
        sync: false
      # MAIL_BACKEND isn't set here: emails go to the Logs tab (log, the
      # default) until it's set to smtp in the dashboard, once the above are in.
